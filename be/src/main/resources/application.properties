spring.application.name=vi-nho-backend
server.port=${PORT:8080}

# Không ghi URL Apps Script trực tiếp vào mã nguồn.
# Hãy đặt biến môi trường GOOGLE_SCRIPT_URL trước khi chạy.
google.script.url=${GOOGLE_SCRIPT_URL:}

# Cho phép frontend Vite và một số dự án React dùng cổng 3000.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
